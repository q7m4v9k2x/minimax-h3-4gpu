<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM 对话 · YMZX</title>
<style>:root{color-scheme:dark;--bg:#08111c;--panel:#101d2b;--line:#294159;--text:#e7f0f8;--muted:#8da4b8;--blue:#6eb6ff;--bad:#ff7d8e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% 0,#193653,transparent 65%),var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{width:min(980px,calc(100% - 34px));margin:auto}header{padding:42px 0 25px;display:flex;justify-content:space-between;align-items:end}h1{font-size:34px;margin:8px 0}.muted{color:var(--muted)}a{color:var(--blue)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0}label{display:block;color:var(--muted);font-size:13px;margin:8px 0 5px}textarea,select,input{width:100%;background:#0b1724;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}textarea{min-height:145px;resize:vertical}.row{display:grid;grid-template-columns:1fr 220px;gap:12px}.btn{background:#1b4e72;border:1px solid #3c7ca9;color:#fff;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:600}.btn:disabled{opacity:.5}.answer{min-height:180px;white-space:pre-wrap;background:#0b1724;border:1px solid var(--line);border-radius:11px;padding:15px}.error{color:var(--bad)}.api{font:12px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#09131f;padding:14px;border-radius:10px;overflow:auto}@media(max-width:650px){.row{grid-template-columns:1fr}header{display:block}}
</style></head><body><div class="wrap"><header><div><div class="muted">YMZX / LANGUAGE MODEL</div><h1>LLM 对话</h1><div id="health" class="muted">正在检查当前后端…</div></div><a href="/">← 返回工作台</a></header><section class="panel"><label for="model">模型</label><select id="model"><option value="ymzx-local">ymzx-local（自动路由）</option></select><label for="prompt">消息</label><textarea id="prompt" placeholder="输入问题，当前实际启动的 LLM 会回答"></textarea><p><button class="btn" id="send">发送</button></p></section><section class="panel"><h2>回答</h2><div id="answer" class="answer muted">等待提问</div></section><section class="panel"><h2>API 用法</h2><div class="api">POST /llm-api/v1/chat/completions
Content-Type: application/json

{"model":"ymzx-local","messages":[{"role":"user","content":"你好"}],"stream":false}

模型列表：GET /llm-api/v1/models</div></section></div>
<script>const $=id=>document.getElementById(id);let online=false;async function check(){try{let r=await fetch('/llm-api/v1/models',{cache:'no-store'});let d=await r.json();online=r.ok;$('health').textContent=online?'● LLM 在线 · '+((d.data||[]).map(x=>x.id).join(', ')||'ymzx-local'):'● LLM 未就绪';$('health').style.color=online?'#4de1a4':'#ff7d8e';$('send').disabled=!online}catch(e){online=false;$('health').textContent='● LLM 未就绪';$('health').style.color='#ff7d8e';$('send').disabled=true}}$('send').onclick=async()=>{if(!online)return;let p=$('prompt').value.trim();if(!p)return;$('send').disabled=true;$('answer').className='answer';$('answer').textContent='生成中…';try{let r=await fetch('/llm-api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('model').value,messages:[{role:'user',content:p}],stream:false})});let d=await r.json();if(!r.ok)throw Error(d.error?.message||d.error||'请求失败');$('answer').textContent=d.choices?.[0]?.message?.content||JSON.stringify(d,null,2)}catch(e){$('answer').className='answer error';$('answer').textContent=e.message}finally{$('send').disabled=!online}};check();setInterval(check,10000);</script></body></html>
